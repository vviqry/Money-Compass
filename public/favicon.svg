<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="greenArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="yellowArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Blue Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Top Green Arrow Arc -->
  <path d="M 140 256 A 120 120 0 0 1 370 180" fill="none" stroke="url(#greenArrow)" stroke-width="48" stroke-linecap="round" />
  <polygon points="350,120 415,190 325,210" fill="url(#greenArrow)" />

  <!-- Bottom Yellow/Orange Arrow Arc -->
  <path d="M 372 256 A 120 120 0 0 1 142 332" fill="none" stroke="url(#yellowArrow)" stroke-width="48" stroke-linecap="round" />
  <polygon points="162,392 97,322 187,302" fill="url(#yellowArrow)" />

  <!-- Center Gold Coin -->
  <circle cx="256" cy="256" r="100" fill="url(#coinGrad)" stroke="#ca8a04" stroke-width="12" />
  <circle cx="256" cy="256" r="82" fill="none" stroke="#fef08a" stroke-width="4" />

  <!-- "Rp" Text -->
  <text x="256" y="285" font-family="sans-serif" font-weight="900" font-size="88" fill="#a16207" text-anchor="middle">Rp</text>
</svg>